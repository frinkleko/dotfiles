# 1. Install TPM (install.sh bootstraps this automatically): mkdir -p ~/.tmux/plugins && cd ~/.tmux/plugins && git clone https://github.com/tmux-plugins/tpm
# 2. Inside tmux press prefix + I to install plugins
##### Manual steps above #####

set-option -g default-shell /bin/zsh
## Remap tmux prefix from Ctrl+b to Ctrl+a
set -g prefix C-a
unbind C-b
bind a send-prefix
#set-option -g prefix2 `

## Core settings
set -g default-terminal "screen-256color"  # enable 256-color support
set -g display-time 3000
set -g history-limit 65535

## Mouse support
# Enables mouse interaction for switching panes/windows, scrolling, resizing, and copying text.
set -g mouse on

## Pane management
# Split panes
unbind '"'
bind - splitw -v -c '#{pane_current_path}'
unbind %
bind | splitw -h -c '#{pane_current_path}'

# Pane navigation
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r e lastp # select last pane
bind -r ^e last # select last window
bind -r ^u swapp -U # swap with previous pane
bind -r ^d swapp -D # swap with next pane
# -r marks repeatable bindings, allowing rapid pane changes when keys are held.

# Resize panes with Ctrl + h/j/k/l while holding the prefix key
bind -r ^k resizep -U 10 # upward (prefix Ctrl+k)
bind -r ^j resizep -D 10 # downward (prefix Ctrl+j)
bind -r ^h resizep -L 10 # to the left (prefix Ctrl+h)
bind -r ^l resizep -R 10 # to the right (prefix Ctrl+l)

## Copy mode
# Use emacs-style key bindings in copy mode (comment out to disable).
setw -g mode-keys emacs
bind Escape copy-mode # use Escape to enter copy mode

## Misc bindings
bind r source-file ~/.tmux.conf \; display-message "source-file ~/.tmux.conf done"  # reload config
bind m command-prompt "splitw -h 'exec man %%'"  # open man in a new pane

## Additional tweaks
set -g base-index 1  # start window numbering at 1
set -g pane-base-index 1  # start pane numbering at 1

setw -g automatic-rename off  # prevent automatic window renaming
setw -g allow-rename off

#set -g set-titles off

## Status line
# set -g status-utf8 on
set -g status-interval 1  # refresh status line every second
set -g status-justify left  # left-align window list
setw -g monitor-activity on  # show activity notifications for inactive windows

#set -g status-bg black
#set -g status-fg yellow
#set -g status-style "bg=black, fg=yellow"

set -g status-left "#[bg=#88cc44] Sess: #S "  # display session name on the left
#set -g status-right 'Continuum status: #{continuum_status}'
set -g status-left-length 300
set -g status-right-length 500

set -wg window-status-format " #I:#W "  # format for inactive windows
set -wg window-status-separator ""
set -wg window-status-current-format " #I:#W #F "  # format for the active window
set -wg window-status-current-style "bg=black, fg=yellow"
#set -wg window-status-last-style "fg=black"

set -g message-style "bg=#202529, fg=#91A8BA"  # message colors

########## Plugins ##########
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux-resurrect saves/restores tmux sessions (PREFIX + Ctrl+s / PREFIX + Ctrl+r).
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @resurrect-strategy-vim 'session'

# tmux-continuum requires tmux >= 1.9, bash, and tmux-resurrect. It saves sessions every 15 minutes.
set -g @plugin 'tmux-plugins/tmux-continuum'
# Auto-start tmux server on Linux machines.
set -g @continuum-boot 'on'  # This is only for Linux. For MacOSX, see: https://github.com/tmux-plugins/tmux-continuum/blob/master/docs/automatic_start.md
# Restore the last saved tmux environment when the server starts.
set -g @continuum-restore 'on'

# Initialize tmux plugin manager (keep this near the end of the file).
run '~/.tmux/plugins/tpm/tpm'
